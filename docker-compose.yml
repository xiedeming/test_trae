version: '3.8'

# 加载环境变量

services:
  # 应用服务
  app:
    build: .
    container_name: spring-reactive-app
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    environment:
      - spring.r2dbc.url=r2dbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - spring.r2dbc.username=${MYSQL_USER}
      - spring.r2dbc.password=${MYSQL_PASSWORD}
      - spring.redis.host=redis
      - spring.redis.port=6379
      - spring.redis.password=${REDIS_PASSWORD}
      - spring.profiles.active=${SPRING_PROFILES_ACTIVE}
      - server.port=${SERVER_PORT}
      - jwt.secret=${JWT_SECRET}
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # MySQL服务
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Redis服务
  redis:
    image: redis:6.2
    container_name: redis-cache
    ports:
      - "6379:6379"
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data: